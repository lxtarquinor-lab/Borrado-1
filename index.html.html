<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Chatbot Studio</title>
  <!-- Librería para renderizar respuestas en Markdown (formato de código, listas, negritas, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #18181b;
      --bg-secondary: #27272a;
      --bg-chat: #09090b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #3f3f46;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg-chat); color: var(--text-main); overflow: hidden; }

    /* Barra Lateral */
    #sidebar {
      width: 280px;
      background-color: var(--bg-primary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
    }

    .btn-new {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-new:hover { background: var(--accent-hover); }

    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .chat-item-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border-radius: 6px;
      padding-right: 5px;
    }

    .chat-item {
      flex: 1;
      padding: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item-wrapper.active { border: 1px solid var(--accent); }
    .chat-item-wrapper.active .chat-item { color: white; }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
      font-size: 14px;
    }
    .btn-delete:hover { color: var(--danger); }

    .api-config {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .api-config input {
      padding: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: white;
      border-radius: 6px;
      outline: none;
    }

    /* Área Principal del Chat */
    #main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; }
    #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

    .message { max-width: 80%; padding: 12px 16px; border-radius: 10px; font-size: 15px; line-height: 1.5; word-break: break-word; }
    .message.user { align-self: flex-end; background-color: var(--accent); color: white; }
    .message.bot { align-self: flex-start; background-color: var(--bg-secondary); border: 1px solid var(--border); }

    /* Área de Entrada */
    #input-area { padding: 20px; border-top: 1px solid var(--border); background: var(--bg-primary); display: flex; gap: 10px; }
    #userInput {
      flex: 1;
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }
    #sendBtn { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #sendBtn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <!-- Panel Lateral -->
  <div id="sidebar">
    <button class="btn-new" onclick="createNewChat()">+ Nuevo Chat</button>
    <div id="chat-list"></div>
    
    <div class="api-config">
      <label for="apiKeyInput">Google Gemini API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Pega tu clave gratis aquí" onchange="saveApiKey()" />
    </div>
  </div>

  <!-- Contenedor Principal -->
  <div id="main-chat">
    <div id="chat-history"></div>
    <div id="input-area">
      <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    let currentChatId = null;
    let chats = JSON.parse(localStorage.getItem("app_chats") || "{}");

    window.onload = () => {
      document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      renderChatList();
      const keys = Object.keys(chats);
      if (keys.length > 0) {
        loadChat(keys[0]);
      } else {
        createNewChat();
      }
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("gemini_api_key", key);
    }

    function createNewChat() {
      const id = "chat_" + Date.now();
      chats[id] = { title: "Nuevo Chat", messages: [] };
      saveData();
      renderChatList();
      loadChat(id);
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      delete chats[id];
      saveData();
      const keys = Object.keys(chats);
      if (keys.length > 0) {
        loadChat(keys[0]);
      } else {
        createNewChat();
      }
      renderChatList();
    }

    function loadChat(id) {
      currentChatId = id;
      renderChatList();
      renderMessages();
    }

    function renderChatList() {
      const container = document.getElementById("chat-list");
      container.innerHTML = "";
      Object.keys(chats).reverse().forEach(id => {
        const wrapper = document.createElement("div");
        wrapper.className = `chat-item-wrapper ${id === currentChatId ? 'active' : ''}`;

        const item = document.createElement("div");
        item.className = "chat-item";
        item.innerText = chats[id].title;
        item.onclick = () => loadChat(id);

        const delBtn = document.createElement("button");
        delBtn.className = "btn-delete";
        delBtn.innerHTML = "✕";
        delBtn.title = "Eliminar chat";
        delBtn.onclick = (e) => deleteChat(id, e);

        wrapper.appendChild(item);
        wrapper.appendChild(delBtn);
        container.appendChild(wrapper);
      });
    }

    function renderMessages() {
      const historyContainer = document.getElementById("chat-history");
      historyContainer.innerHTML = "";
      if (!currentChatId || !chats[currentChatId]) return;

      chats[currentChatId].messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = `message ${msg.role}`;
        div.innerHTML = msg.role === 'bot' ? marked.parse(msg.text) : msg.text;
        historyContainer.appendChild(div);
      });
      historyContainer.scrollTop = historyContainer.scrollHeight;
    }

    async function sendMessage() {
      const apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        alert("Por favor ingresa tu API Key gratuita de Google en el panel lateral.");
        return;
      }

      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      // Actualizar título del chat con el primer mensaje
      if (chats[currentChatId].messages.length === 0) {
        chats[currentChatId].title = text.substring(0, 22) + "...";
      }

      // Guardar y mostrar el mensaje del usuario
      chats[currentChatId].messages.push({ role: "user", text: text });
      input.value = "";
      renderMessages();
      saveData();

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: chats[currentChatId].messages.map(m => ({
              role: m.role === "user" ? "user" : "model",
              parts: [{ text: m.text }]
            }))
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const botReply = data.candidates[0].content.parts[0].text;

        chats[currentChatId].messages.push({ role: "bot", text: botReply });
        renderMessages();
        saveData();
      } catch (err) {
        alert("Error al conectar con la API: " + err.message);
      }
    }

    function saveData() {
      localStorage.setItem("app_chats", JSON.stringify(chats));
    }
  </script>
</body>
</html>
